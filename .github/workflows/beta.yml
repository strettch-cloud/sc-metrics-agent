# beta.yml - Beta Release Workflow
# Every merge to main produces a beta GitHub pre-release with signed build
# provenance.
name: Beta Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions: {}

# Betas run one at a time so two runs never compute the same beta number. GitHub
# keeps one pending run per group, so a newer push replaces a queued beta; that is
# safe because the newer run includes its commits. Stable releases use their own
# group so a beta can never cancel a queued one.
concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  version:
    name: Generate beta version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needs all tags to compute the next beta number
          persist-credentials: false

      - name: Generate beta version
        id: version
        run: |
          VERSION=$(.github/scripts/generate-version.sh beta)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Generated beta version: $VERSION"

  build:
    name: Build
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: beta

  publish:
    name: Publish GitHub pre-release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the tag and the release
      id-token: write      # sign the build provenance
      attestations: write  # store the attestation
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog walks history since the last tag
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb

      - name: Generate changelog
        run: .github/scripts/generate-changelog.sh beta > release-notes.md

      # The tag is created by the API at the exact commit that was built.
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$VERSION" dist/*.deb dist/packages.sha256 \
            --target "$GITHUB_SHA" \
            --title "Beta $VERSION" \
            --notes-file release-notes.md \
            --prerelease
