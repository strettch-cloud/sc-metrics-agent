# release.yml - Stable Release Workflow
# Manually dispatched from main. Produces a stable GitHub release with signed
# build provenance.
name: Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options: [patch, minor, major]

permissions: {}

# Stable releases run one at a time so two runs never publish the same tag. Kept
# separate from beta.yml: GitHub keeps one pending run per group, so a shared
# group would let a beta push cancel a queued stable release.
concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    # Dispatching from any other branch would release unreviewed code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
    # Inputs go through env, never interpolated into the script.
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_TYPE: ${{ inputs.release_type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needs all tags to validate the increment
          persist-credentials: false

      - name: Validate semantic version
        id: validate
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Version $VERSION already exists"
            exit 1
          fi

          ./.github/scripts/validate-version.sh "$VERSION" "$RELEASE_TYPE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Validated version: $VERSION"

  build:
    name: Build
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      channel: stable

  publish:
    name: Publish GitHub release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the tag and the release
      id-token: write      # sign the build provenance
      attestations: write  # store the attestation
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TYPE: ${{ inputs.release_type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog walks history since the last tag
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb

      - name: Generate changelog
        run: |
          {
            .github/scripts/generate-changelog.sh stable
            echo
            echo "**Type:** ${RELEASE_TYPE} · **Build:** ${GITHUB_SHA}"
          } > release-notes.md

      # The tag is created by the API at the exact commit that was built.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$VERSION" dist/*.deb dist/packages.sha256 \
            --target "$GITHUB_SHA" \
            --title "Release v$VERSION" \
            --notes-file release-notes.md \
            --latest
