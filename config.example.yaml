# SC Metrics Agent Configuration
# Copy the settings you need to /etc/sc-metrics-agent/config.yaml, then restart
# the service. SC_AGENT_CONFIG can point at another file instead.

# The metadata service address comes from /etc/strettchcloud/config/agent.yaml.
# Set it here only to replace that address, for example in a test.
# metadata_service:
#   base_url: "http://<metadata-service-host>:8000"

# Collection settings
collection_interval: 30s
http_timeout: 30s


# Full metadata service endpoint. Replaces the one built from base_url.
# metadata_service_endpoint: "http://<metadata-service-host>:8000/metadata/v1/auth-token"

# Agent identification - VM ID will be automatically detected if not specified
vm_id: ""

# Additional labels to attach to all metrics
labels:
  environment: "production"
  region: "us-east-1"
  team: "platform"
  service: "web-frontend"

# Collectors configuration - specify which metrics to collect
collectors:
  # Process and system metrics
  processes: true
  cpu: true
  cpu_freq: true
  loadavg: true
  
  # Memory metrics  
  memory: true
  vmstat: true
  
  # Storage metrics
  disk: true
  diskstats: true
  filesystem: true
  
  # Network metrics
  network: true
  netdev: true
  netstat: true
  sockstat: true
  
  # System information
  uname: true
  time: true
  uptime: true
  entropy: true
  interrupts: true
  
  # Advanced metrics
  thermal: true
  pressure: true
  schedstat: true

# Logging configuration
log_level: "info"

# Retry settings
max_retries: 3
retry_interval: 5s

# On-disk metric buffer location. 
buffer_dir: /var/lib/sc-metrics-agent/buffer