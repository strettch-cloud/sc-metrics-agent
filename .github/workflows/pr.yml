name: Pull Request Validation

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validation:
    name: Test, Lint & Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # polin-guard --ci needs full history to see all tracked files

    - name: Scan for injected payloads (polin-guard)
      run: npx --yes polin-guard@0.3.2 --ci

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.10'
        cache: true

    - name: Run Trivy Vulnerability Scanner (SCA)
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'
        skip-dirs: '.envs'
        skip-files: '.env'

    - name: Run Govulncheck
      uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1.0.4

    - name: Run tests
      run: make test

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
      with:
        version: v2.12.2
        working-directory: .

    - name: Build for Linux AMD64
      run: make GOOS=linux GOARCH=amd64 build

    - name: Verify binary
      run: |
        ls -la build/
        file build/sc-metrics-agent
        ./build/sc-metrics-agent -v

