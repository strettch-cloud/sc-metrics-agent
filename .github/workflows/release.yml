# release.yml - Stable Release Workflow
# Manually dispatched from main. Produces a stable GitHub release with signed
# build provenance.
name: Stable Release

on:
  workflow_dispatch:
    inputs:
      major:
        description: 'Major release (raise X in X.Y.Z). Otherwise the commits since the last stable release decide: any feat raises Y, anything else Z.'
        required: true
        type: boolean
        default: false

permissions: {}

# Stable releases run one at a time so two runs never publish the same tag. Kept
# separate from beta.yml: GitHub keeps one pending run per group, so a shared
# group would let a beta push cancel a queued stable release.
concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  version:
    name: Generate stable version
    # Dispatching from any other branch would release unreviewed code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Inputs go through env, never interpolated into the script.
    env:
      MAJOR: ${{ inputs.major }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needs all tags and the commits since the last stable one
          persist-credentials: false

      # Fails with "nothing to release" when main has no commits since the last
      # stable release.
      - name: Generate stable version
        id: version
        run: |
          if [ "$MAJOR" = true ]; then
            VERSION=$(.github/scripts/next-version.sh stable --major)
          else
            VERSION=$(.github/scripts/next-version.sh stable)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Generated stable version: $VERSION"

  build:
    name: Build
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: stable

  publish:
    name: Publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the tag and the release
      id-token: write      # sign the build provenance
      attestations: write  # store the attestation
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog walks history since the last tag
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb

      - name: Generate changelog
        run: |
          {
            .github/scripts/generate-changelog.sh stable
            echo
            echo "**Build:** ${GITHUB_SHA}"
          } > release-notes.md

      # The tag is created by the API at the exact commit that was built.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$VERSION" dist/*.deb dist/packages.sha256 \
            --target "$GITHUB_SHA" \
            --title "Release v$VERSION" \
            --notes-file release-notes.md \
            --latest
