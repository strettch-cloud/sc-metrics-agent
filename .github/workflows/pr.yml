name: Pull Request Validation

# Every base branch, not only main: a pull request stacked on another one
# targets that one's branch and still needs its checks.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  # Trust the repository's mise.toml without running `mise trust`.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

# Go, golangci-lint, trivy and govulncheck are pinned in mise.toml; every step
# below runs the same `mise run` task a developer runs locally.
jobs:
  validation:
    name: Test, Lint & Build
    runs-on: ubuntu-24.04
    outputs:
      # For the coverage-comment job. Set even when a later step fails.
      coverage-report: ${{ steps.coverage-report.outputs.markdown }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # polin-guard --ci needs full history to see all tracked files
          persist-credentials: false

      - name: Scan for injected payloads (polin-guard)
        run: npx --yes polin-guard@0.3.2 --ci

      # Release builds package this keyring; build it here so an unreadable key
      # file in packaging/keys fails the PR, not beta.yml.
      - name: Build APT keyring
        run: ./.github/scripts/build-keyring.sh "$RUNNER_TEMP/apt-keyring.gpg"

      - name: Check APT keys match sc-agent
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: ./.github/scripts/check-keys-sync.sh strettch-cloud/sc-agent "$HEAD_REF"

      - name: Install toolchain (mise.toml)
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          sha256: f9612efcddda0ae55b62d3b6f82a6c860d5b54ebee0807d4f1a1d578055e1607

      - name: Security scan (Trivy + govulncheck)
        run: mise run security-scan

      - name: Run tests
        run: mise run test

      # Also runs when the tests fail on the coverage minimum, so the summary
      # and the comment show which package lost coverage.
      - name: Coverage report (run summary)
        id: coverage-report
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        run: |
          report=$(.github/scripts/coverage-report.sh coverage.out)
          printf '%s\n' "$report" >> "$GITHUB_STEP_SUMMARY"
          printf 'markdown<<END_OF_COVERAGE_REPORT\n%s\nEND_OF_COVERAGE_REPORT\n' "$report" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: mise run lint

      - name: Lint packaging (shellcheck, systemd units)
        run: mise run lint-packaging

      - name: Build for Linux AMD64
        env:
          GOOS: linux
          GOARCH: amd64
        run: mise run build

      - name: Verify binary
        run: |
          ls -la build/
          file build/sc-metrics-agent
          ./build/sc-metrics-agent -v

  # Posts the coverage report on the pull request as one comment that each run
  # updates. It is the only job with a write token, so it runs nothing from the
  # repository or its dependencies: no checkout, only gh.
  coverage-comment:
    name: Coverage comment
    needs: validation
    # Pull requests from forks get a read-only token, so they keep only the run
    # summary. !cancelled() still posts the report when the tests fail.
    if: ${{ !cancelled() && needs.validation.outputs.coverage-report != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write

    steps:
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPORT: ${{ needs.validation.outputs.coverage-report }}
          # How the next run finds this comment to update it.
          MARKER: '<!-- coverage-report -->'
        run: |
          body="$RUNNER_TEMP/coverage-comment.md"
          printf '%s\n%s\n\nFor commit %s.\n' "$MARKER" "$REPORT" "$HEAD_SHA" > "$body"
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id' | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH --silent "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --field body=@"$body"
          else
            gh api --method POST --silent "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/comments" --field body=@"$body"
          fi

  # Installs, upgrades and removes the real .deb under systemd on each
  # supported OS (test/lifecycle). It runs only after validation passes, so
  # nothing is installed before the malware scan, and one job per OS runs in
  # parallel.
  lifecycle:
    name: Package lifecycle (${{ matrix.os }})
    needs: validation
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'debian:13']
    env:
      FPM_VERSION: '1.18.0' # same as _build.yml
      # Google's mirror of the official images avoids Docker Hub's pull limits.
      LIFECYCLE_IMAGE: mirror.gcr.io/library/${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain (mise.toml)
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          sha256: f9612efcddda0ae55b62d3b6f82a6c860d5b54ebee0807d4f1a1d578055e1607
          # Only Go: the linters and scanners already ran in validation.
          install_args: go

      - name: Install fpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq ruby ruby-dev build-essential
          sudo gem install --no-document fpm -v "$FPM_VERSION"

      - name: Download the latest release's package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*_amd64.deb' --dir "$RUNNER_TEMP/previous"
          previous_deb=$(ls "$RUNNER_TEMP"/previous/*_amd64.deb)
          echo "LIFECYCLE_PREVIOUS_DEB=$previous_deb" >> "$GITHUB_ENV"
          # The package under test must sort after the release for apt to upgrade.
          echo "VERSION=$(dpkg-deb --field "$previous_deb" Version)+ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build the package under test
        run: |
          GOOS=linux GOARCH=amd64 mise run build
          ./.github/scripts/build-package.sh "$VERSION" stable amd64
          echo "LIFECYCLE_DEB=$PWD/sc-metrics-agent_${VERSION}_amd64.deb" >> "$GITHUB_ENV"

      - name: Install, upgrade and remove under systemd
        working-directory: test/lifecycle
        run: go test -tags lifecycle -count=1 -v -timeout 15m .
