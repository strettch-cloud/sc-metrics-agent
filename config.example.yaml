# SC Metrics Agent Configuration
# Copy this to /etc/sc-metrics-agent/config.yaml and restart the service.
#
# log_level is the only setting this file accepts: debug, info, warn or error.
# If the file holds anything else, or a level the agent doesn't know, the agent
# ignores the whole file, logs why, and runs on its defaults.
# `sc-metrics-agent --validate-config /etc/sc-metrics-agent/config.yaml`
# reports the problem.
log_level: info
