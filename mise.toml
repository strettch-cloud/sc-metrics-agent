# sc-metrics-agent toolchain and tasks. Run `mise install` once, then
# `mise run <task>` (`mise tasks` lists them). CI runs the same tasks.

[tools]
go = "1.26.9"
# Built from source with the pinned Go above (a prebuilt release binary can be
# compiled with an older Go than the module targets and then fail to load the config).
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "v2.12.2"
# Security scanners used by scripts/security-scan.sh.
"aqua:aquasecurity/trivy" = "0.70.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
# Lints the shell scripts the package ships and CI runs (lint-packaging).
"aqua:koalaman/shellcheck" = "0.11.0"

[env]
BINARY_NAME = "sc-metrics-agent"
BUILD_DIR = "build"
MAIN_PATH = "./cmd/agent"

[tasks.deps]
description = "Fetch Go modules"
run = "go mod download"

[tasks.build]
description = "Build for GOOS/GOARCH (default: this machine). VERSION overrides git describe."
depends = ["deps"]
run = '''
VERSION=${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}
COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
mkdir -p "$BUILD_DIR"
CGO_ENABLED=0 go build \
  -ldflags "-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.buildTime=$BUILD_TIME" \
  -o "$BUILD_DIR/$BINARY_NAME" "$MAIN_PATH"
echo "Build complete: $BUILD_DIR/$BINARY_NAME"
'''

[tasks.package]
description = "Build amd64 and arm64 .deb packages: mise run package <version> [channel]"
run = '.github/scripts/build-all-packages.sh {{arg(name="version")}} {{arg(name="channel", default="stable")}}'

[tasks.clean]
run = "rm -rf $BUILD_DIR coverage.out coverage-raw.out coverage.html *.deb packages.sha256"

[tasks.run]
description = "Build and run the agent"
depends = ["build"]
run = "exec $BUILD_DIR/$BINARY_NAME"

[tasks.run-debug]
description = "Build and run the agent with debug logging"
depends = ["build"]
run = "SC_LOG_LEVEL=debug exec $BUILD_DIR/$BINARY_NAME"


[tasks.fmt]
run = "golangci-lint fmt"

[tasks.lint]
description = "Check only (CI-safe)"
depends = ["deps"]
run = "golangci-lint run"

[tasks.lint-fix]
description = "Lint and auto-fix"
run = "golangci-lint run --fix"

[tasks.lint-packaging]
description = "shellcheck every script, and check the systemd units (CI-safe)"
run = """
shellcheck packaging/scripts/*.sh .github/scripts/*.sh
.github/scripts/verify-units.sh packaging/systemd
"""

[tasks.vet]
run = "go vet ./..."

[tasks.security-scan]
description = "Trivy (dependencies) + govulncheck (reachable vulnerabilities)"
run = "./scripts/security-scan.sh"

# ── tests ─────────────────────────────────────────────────────────────────────

[tasks.test]
description = "Tests with the race detector; coverage in coverage.out, total printed last"
depends = ["deps"]
# The run fails when total coverage drops below this. Raise it with every pull
# request that adds tests, until it reaches the 98 target.
env = { COVERAGE_MINIMUM = "53.5" }
run = '''
set -e
# -coverpkg=./... credits a test with every package it runs, not only its own,
# so integration tests count toward the code they exercise.
go test -race -coverpkg=./... -coverprofile=coverage-raw.out ./...
# coverage.out is coverage-raw.out minus the files .coverageignore lists.
# Blank and comment lines are skipped: a blank pattern would match every line.
patterns=$(mktemp)
trap 'rm -f "$patterns"' EXIT
grep -vE '^[[:space:]]*(#|$)' .coverageignore > "$patterns" || [ $? -eq 1 ]
head -n 1 coverage-raw.out > coverage.out
# grep exits 1 when no line is left, which is fine, and 2 on an invalid pattern.
tail -n +2 coverage-raw.out | grep -vE -f "$patterns" >> coverage.out || [ $? -eq 1 ]
# Assigned first: in a pipeline, set -e would only see tail's exit status.
coverage_report=$(go tool cover -func=coverage.out)
printf '%s\n' "$coverage_report" | tail -n 1
total=$(printf '%s\n' "$coverage_report" | awk '$1 == "total:" { sub(/%$/, "", $NF); print $NF }')
if awk -v total="$total" -v minimum="$COVERAGE_MINIMUM" 'BEGIN { exit !(total < minimum) }'; then
  echo "Coverage ${total}% is below the minimum of ${COVERAGE_MINIMUM}% set in mise.toml." >&2
  exit 1
fi
'''

[tasks.test-coverage]
description = "Tests plus an HTML coverage report in coverage.html"
depends = ["test"]
run = "go tool cover -html=coverage.out -o coverage.html"

[tasks.bench]
run = "go test -bench=. -benchmem ./..."
